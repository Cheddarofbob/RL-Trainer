<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Trainer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #b8c2d9;
      font-size: 18px;
    }

    .card {
      margin-top: 30px;
      padding: 25px;
      background: #1b2233;
      border-radius: 12px;
    }

    select,
    button {
      margin: 8px;
      padding: 14px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
    }

    select {
      background: white;
      color: #101522;
    }

    button {
      background: #168cff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0072e5;
    }

    .pack-name {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .pack-code {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: #66b5ff;
    }

    .routine {
      margin-top: 25px;
      text-align: left;
      background: #141a28;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .routine h2 {
      text-align: center;
    }

    .routine-item {
      margin: 15px 0;
      padding: 15px;
      background: #1f283b;
      border-radius: 8px;
    }

    .code {
      font-weight: bold;
      color: #66b5ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 RL Trainer</h1>

    <p>
      Train smarter. Improve your mechanics. Climb the ranks.
    </p>

    <div class="card">

      <h2>Random Training Pack</h2>

      <div class="pack-name" id="packName">
        Click below to get a training pack
      </div>

      <div class="pack-code" id="packCode">
        ---- ---- ----
      </div>

      <button onclick="getRandomPack()">
        Give Me a Random Pack
      </button>

      <button onclick="copyCode()">
        Copy Code
      </button>

    </div>

    <div class="card">

      <h2>What Should I Train?</h2>

      <p>
        Choose your rank and get a 30-minute training routine.
      </p>

      <select id="rank">
        <option value="">Choose your rank</option>
        <option value="bronze">Bronze</option>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="platinum">Platinum</option>
        <option value="diamond">Diamond</option>
        <option value="champion">Champion</option>
        <option value="grandchampion">Grand Champion</option>
        <option value="ssl">Supersonic Legend</option>
      </select>

      <button onclick="generateRoutine()">
        Build My Routine
      </button>

      <div class="routine" id="routine"></div>

    </div>

  </div>

  <script>

    const trainingPacks = [
      {
        name: "Shooting Consistency",
        code: "4912-A5C9-9A56-555D"
      },
      {
        name: "Aerial Car Control",
        code: "A3E1-92C2-8757-4195"
      },
      {
        name: "Novice Aerials",
        code: "0A40-E21D-61C1-49C6"
      },
      {
        name: "Shadow Saves",
        code: "6A8C-7B90-2AAA-B6B5"
      },
      {
        name: "Ground Shots",
        code: "7C94-D3A7-46A9-82DC"
      },
      {
        name: "Powershots",
        code: "7028-5E10-88EF-E83E"
      },
      {
        name: "Backboard Shots",
        code: "AFFD-5023-BD4F-D320"
      },
      {
        name: "Fast Aerials / Redirects",
        code: "24A2-849A-610E-C67C"
      }
    ];

    const routines = {

      bronze: [
        {
          skill: "Basic Saves",
          time: "10 minutes",
          code: "6AFE-E510-BAA3-CB43"
        },
        {
          skill: "Ball Contact Practice",
          time: "10 minutes",
          code: "Use Free Play. Focus on simply making solid contact."
        },
        {
          skill: "Driving & Recoveries",
          time: "10 minutes",
          code: "Practice powerslides, flips and landing on your wheels."
        }
      ],

      silver: [
        {
          skill: "Ground Shots",
          time: "10 minutes",
          code: "729C-E297-873F-8579"
        },
        {
          skill: "Basic Aerials",
          time: "10 minutes",
          code: "57AA-3994-71EC-7BCD"
        },
        {
          skill: "Power Hits",
          time: "10 minutes",
          code: "DC62-FEEC-D575-1B6F"
        }
      ],

      gold: [
        {
          skill: "Ground Shooting",
          time: "10 minutes",
          code: "7C94-D3A7-46A9-82DC"
        },
        {
          skill: "Aerial Car Control",
          time: "10 minutes",
          code: "A3E1-92C2-8757-4195"
        },
        {
          skill: "Defense",
          time: "10 minutes",
          code: "87E7-773A-CBE5-B2C3"
        }
      ],

      platinum: [
        {
          skill: "Shooting Consistency",
          time: "10 minutes",
          code: "4912-A5C9-9A56-555D"
        },
        {
          skill: "Shadow Saves",
          time: "10 minutes",
          code: "6A8C-7B90-2AAA-B6B5"
        },
        {
          skill: "Wall / Backboard Training",
          time: "10 minutes",
          code: "152C-2EAC-5269-4402"
        }
      ],

      diamond: [
        {
          skill: "Powershots",
          time: "10 minutes",
          code: "7028-5E10-88EF-E83E"
        },
        {
          skill: "Backboard Reads",
          time: "10 minutes",
          code: "DEE2-0629-B3A4-D717"
        },
        {
          skill: "Double Touch Practice",
          time: "10 minutes",
          code: "E8EB-C454-38AF-9637"
        }
      ],

      champion: [
        {
          skill: "Backboard Shots",
          time: "10 minutes",
          code: "AFFD-5023-BD4F-D320"
        },
        {
          skill: "Redirects",
          time: "10 minutes",
          code: "4B34-668E-8D1B-05BC"
        },
        {
          skill: "High-Speed Recoveries",
          time: "10 minutes",
          code: "Use Free Play. Practice wave dashes, half flips and fast recoveries."
        }
      ],

      grandchampion: [
        {
          skill: "Fast Aerials / Redirects",
          time: "10 minutes",
          code: "24A2-849A-610E-C67C"
        },
        {
          skill: "Advanced Redirects",
          time: "10 minutes",
          code: "BE27-2F2E-44FF-5A38"
        },
        {
          skill: "High-Speed Free Play",
          time: "10 minutes",
          code: "Play as fast as possible while maintaining possession and control."
        }
      ],

      ssl: [
        {
          skill: "Advanced Mechanical Warmup",
          time: "10 minutes",
          code: "2186-5167-B7C8-C46F"
        },
        {
          skill: "Elite Reads & Redirects",
          time: "10 minutes",
          code: "24A2-849A-610E-C67C"
        },
        {
          skill: "Match-Speed Free Play",
          time: "10 minutes",
          code: "Train at full speed with minimal resets. Focus on efficiency and precision."
        }
      ]

    };

    function getRandomPack() {

      const randomIndex =
        Math.floor(Math.random() * trainingPacks.length);

      const pack =
        trainingPacks[randomIndex];

      document.getElementById("packName").textContent =
        pack.name;

      document.getElementById("packCode").textContent =
        pack.code;
    }

    function copyCode() {

      const code =
        document.getElementById("packCode").textContent;

      if (code === "---- ---- ----") {
        alert("Get a training pack first.");
        return;
      }

      navigator.clipboard.writeText(code);

      alert("Training pack code copied!");
    }

    function generateRoutine() {

      const rank =
        document.getElementById("rank").value;

      const routineBox =
        document.getElementById("routine");

      if (!rank) {
        alert("Choose your rank first.");
        return;
      }

      const selectedRoutine =
        routines[rank];

      let html =
        "<h2>Your 30-Minute Training Routine</h2>";

      selectedRoutine.forEach(item => {

        html += `
          <div class="routine-item">
            <strong>${item.skill}</strong><br><br>
            ⏱ ${item.time}<br><br>
            <span class="code">${item.code}</span>
          </div>
        `;

      });

      routineBox.innerHTML = html;
      routineBox.style.display = "block";
    }

  </script>

</body>
</html>
