<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Trainer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #b8c2d9;
    }

    .card {
      margin-top: 25px;
      padding: 25px;
      background: #1b2233;
      border-radius: 12px;
    }

    select,
    button {
      margin: 8px;
      padding: 12px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
    }

    select {
      background: white;
      color: #101522;
    }

    button {
      background: #168cff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0072e5;
    }

    .results {
      margin-top: 25px;
      display: none;
    }

    .pack {
      background: #141a28;
      margin: 15px 0;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
    }

    .pack h3 {
      margin-top: 0;
    }

    .code {
      color: #66b5ff;
      font-weight: bold;
      font-size: 18px;
    }

    .difficulty {
      font-size: 14px;
      color: #b8c2d9;
    }

    .random-box {
      font-size: 20px;
      margin: 20px 0;
    }

    footer {
      margin-top: 40px;
      color: #7f8ba3;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 RL Trainer</h1>

    <p>
      Find training packs based on your rank and what you want to improve.
    </p>

    <!-- RANDOM PACK -->

    <div class="card">

      <h2>Random Training Pack</h2>

      <div class="random-box" id="randomPack">
        Click below to get a random pack.
      </div>

      <button onclick="getRandomPack()">
        Give Me a Random Pack
      </button>

    </div>


    <!-- TRAINING PACK FINDER -->

    <div class="card">

      <h2>Find Training Packs</h2>

      <p>
        Choose your rank and the skill you want to train.
      </p>

      <select id="rank">
        <option value="">Choose Rank</option>
        <option value="bronze">Bronze</option>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="platinum">Platinum</option>
        <option value="diamond">Diamond</option>
        <option value="champion">Champion</option>
        <option value="grandchampion">Grand Champion</option>
        <option value="ssl">Supersonic Legend</option>
      </select>

      <select id="skill">
        <option value="">Choose Skill</option>
        <option value="shooting">Shooting</option>
        <option value="aerials">Aerials</option>
        <option value="defense">Defense</option>
        <option value="wall">Wall / Backboard</option>
        <option value="doubletouch">Double Touches</option>
        <option value="allaround">All-Around</option>
      </select>

      <button onclick="findPacks()">
        Find My Packs
      </button>

      <div class="results" id="results"></div>

    </div>

    <footer>
      RL Trainer — community-focused Rocket League training tools.
    </footer>

  </div>


  <script>

    const packs = [

      {
        name: "Ground Shots",
        code: "6EB1-79B2-33B8-681C",
        skill: "shooting",
        minRank: 0,
        maxRank: 4,
        difficulty: "Beginner - Intermediate"
      },

      {
        name: "Shooting Consistency",
        code: "4912-A5C9-9A56-555D",
        skill: "shooting",
        minRank: 2,
        maxRank: 6,
        difficulty: "Intermediate"
      },

      {
        name: "Power Shots",
        code: "7028-5E10-88EF-E83E",
        skill: "shooting",
        minRank: 3,
        maxRank: 7,
        difficulty: "Intermediate - Advanced"
      },

      {
        name: "Novice Aerials",
        code: "0A40-E21D-61C1-49C6",
        skill: "aerials",
        minRank: 1,
        maxRank: 3,
        difficulty: "Beginner"
      },

      {
        name: "Aerial Car Control",
        code: "A3E1-92C2-8757-4195",
        skill: "aerials",
        minRank: 2,
        maxRank: 5,
        difficulty: "Intermediate"
      },

      {
        name: "Aerial Shots - Pass",
        code: "C7E0-9E0B-B739-A899",
        skill: "aerials",
        minRank: 2,
        maxRank: 6,
        difficulty: "Intermediate"
      },

      {
        name: "Fast Aerial Double Jump",
        code: "F269-B159-0BAC-AC2E",
        skill: "aerials",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Saves",
        code: "2E23-ABD5-20C6-DBD4",
        skill: "defense",
        minRank: 0,
        maxRank: 4,
        difficulty: "Beginner - Intermediate"
      },

      {
        name: "Shadow Defense",
        code: "5CCE-FB29-7B05-A0B1",
        skill: "defense",
        minRank: 2,
        maxRank: 7,
        difficulty: "Intermediate - Advanced"
      },

      {
        name: "Backboard Defense",
        code: "99E5-4AA3-60D5-44BD",
        skill: "defense",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Backboard Therapy",
        code: "D7F8-FD53-98D1-DAFE",
        skill: "wall",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Backboard Shots",
        code: "AFFD-5023-BD4F-D320",
        skill: "wall",
        minRank: 3,
        maxRank: 7,
        difficulty: "Intermediate - Advanced"
      },

      {
        name: "Double Tap Playground",
        code: "CAFC-FB3E-3C0F-B8F1",
        skill: "doubletouch",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Deevo",
        code: "0CB0-16C8-DAAD-B578",
        skill: "doubletouch",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Self Set Backboard Consistency",
        code: "23BC-0377-C228-A338",
        skill: "doubletouch",
        minRank: 5,
        maxRank: 7,
        difficulty: "High Advanced"
      },

      {
        name: "Ultimate Warmup",
        code: "FA24-B2B7-2E8E-193B",
        skill: "allaround",
        minRank: 3,
        maxRank: 7,
        difficulty: "Intermediate - Advanced"
      },

      {
        name: "First Touch Practice",
        code: "F43A-8231-0B8F-B9FA",
        skill: "allaround",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      },

      {
        name: "Ground to Air Dribble",
        code: "71F9-F223-C3A8-993A",
        skill: "allaround",
        minRank: 4,
        maxRank: 7,
        difficulty: "Advanced"
      }

    ];


    const rankLevels = {
      bronze: 0,
      silver: 1,
      gold: 2,
      platinum: 3,
      diamond: 4,
      champion: 5,
      grandchampion: 6,
      ssl: 7
    };


    function findPacks() {

      const rank = document.getElementById("rank").value;
      const skill = document.getElementById("skill").value;
      const results = document.getElementById("results");

      if (!rank || !skill) {
        alert("Choose both your rank and a skill.");
        return;
      }

      const level = rankLevels[rank];

      const matches = packs.filter(pack => {

        const rankMatch =
          level >= pack.minRank &&
          level <= pack.maxRank;

        const skillMatch =
          pack.skill === skill;

        return rankMatch && skillMatch;

      });


      if (matches.length === 0) {

        results.innerHTML = `
          <div class="pack">
            <h3>No specific pack found</h3>
            <p>
              Try All-Around training or choose another skill.
            </p>
          </div>
        `;

        results.style.display = "block";

        return;
      }


      let html = "<h2>Recommended Training Packs</h2>";


      matches.forEach(pack => {

        html += `
          <div class="pack">

            <h3>${pack.name}</h3>

            <div class="difficulty">
              Difficulty: ${pack.difficulty}
            </div>

            <p class="code">
              ${pack.code}
            </p>

            <button onclick="copyPack('${pack.code}')">
              Copy Code
            </button>

          </div>
        `;

      });


      results.innerHTML = html;
      results.style.display = "block";

    }


    function copyPack(code) {

      navigator.clipboard.writeText(code);

      alert("Training pack code copied!");

    }


    function getRandomPack() {

      const randomIndex =
        Math.floor(Math.random() * packs.length);

      const pack =
        packs[randomIndex];

      document.getElementById("randomPack").innerHTML = `

        <strong>${pack.name}</strong>

        <br><br>

        <span class="code">
          ${pack.code}
        </span>

        <br><br>

        ${pack.difficulty}

        <br>

        <button onclick="copyPack('${pack.code}')">
          Copy Code
        </button>

      `;

    }

  </script>

</body>
</html>
